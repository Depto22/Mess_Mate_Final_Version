<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Members - MESS-MATE Premium</title>

  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="members.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">MESS-MATE</div>
    <nav>
      <a href="dashboard.html#members">Members</a>
      <a href="dashboard.html#tasks">Tasks</a>
      <a href="dashboard.html#meals">Meals</a>
      <a href="dashboard.html#debts">Debts</a>
      <a href="dashboard.html#notice">Notice Board</a>
    </nav>
  </header>

  <div class="member-container">
    <button class="back-button" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
    
    <h1>Manage Members</h1>
    
    <div class="card member-form">
      <h2>Remove Member</h2>
      <p>Only the mess manager can remove members. Select a member from the list below and click Delete.</p>
    </div>
    
    <div class="card member-list">
      <h2>Current Members</h2>
      <div id="members-container">
        <!-- Members will be added here dynamically -->
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 MESS-MATE Premium</p>
  </footer>

  <style>
    .edit-btn {
      background: #2196F3;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 5px;
    }
    .edit-btn:hover {
      background: #1976D2;
    }
  </style>
  <script type="module" src="members-firebase.js"></script>
</body>
</html>
