<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleanup Orphaned Users - MESS-MATE</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    h1 { color: #2c3e50; }
    button { background: #3498db; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #2980b9; }
    #result { margin-top: 20px; padding: 15px; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    ul { margin: 10px 0; }
  </style>
</head>
<body>
  <h1>🧹 Cleanup Orphaned Users</h1>
  <p>এই tool টি সব orphaned users খুঁজে বের করবে (যাদের messId আছে কিন্তু members collection এ নেই) এবং তাদের messId ও role clear করবে।</p>
  
  <button id="cleanup-btn">Start Cleanup</button>
  
  <div id="result"></div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { collection, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    document.getElementById('cleanup-btn').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<div class="info">Processing... Please wait...</div>';
      
      try {
        // Get all users
        const usersSnapshot = await getDocs(collection(db, 'users'));
        const orphanedUsers = [];
        
        // Check each user
        for (const userDoc of usersSnapshot.docs) {
          const userData = userDoc.data();
          
          // Skip users without messId
          if (!userData.messId) continue;
          
          // Check if user exists in members collection
          const membersSnapshot = await getDocs(collection(db, `messes/${userData.messId}/members`));
          let foundInMembers = false;
          
          membersSnapshot.forEach(memberDoc => {
            if (memberDoc.data().email === userData.email) {
              foundInMembers = true;
            }
          });
          
          // If not found in members, this is an orphaned user
          if (!foundInMembers) {
            orphanedUsers.push({
              id: userDoc.id,
              name: userData.name,
              email: userData.email,
              messId: userData.messId
            });
          }
        }
        
        if (orphanedUsers.length === 0) {
          resultDiv.innerHTML = '<div class="success"><strong>✅ Success!</strong><br>No orphaned users found. All users are properly synced.</div>';
          return;
        }
        
        // Clean up orphaned users
        let cleaned = 0;
        for (const user of orphanedUsers) {
          await updateDoc(doc(db, 'users', user.id), {
            messId: null,
            role: null
          });
          cleaned++;
        }
        
        resultDiv.innerHTML = `
          <div class="success">
            <strong>✅ Cleanup Complete!</strong><br>
            <p>Found and cleaned ${cleaned} orphaned user(s):</p>
            <ul>
              ${orphanedUsers.map(u => `<li>${u.name} (${u.email}) - messId: ${u.messId}</li>`).join('')}
            </ul>
            <p>These users can now rejoin their mess.</p>
          </div>
        `;
        
      } catch (error) {
        console.error('Cleanup error:', error);
        resultDiv.innerHTML = `<div class="error"><strong>❌ Error!</strong><br>${error.message}</div>`;
      }
    });
  </script>
</body>
</html>
